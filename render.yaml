services:
  - type: web
    name: vyapar-billing
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn billing_management.wsgi:application"
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "1"
      - key: SECURE_HSTS_PRELOAD
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: vyapar-billing-db
          property: connectionString

databases:
  - name: vyapar-billing-db
    plan: free
