{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<form method="post" enctype="multipart/form-data" class="panel form-panel">
  {% csrf_token %}
  <div class="row g-3">
    {% for field in form %}
    <div class="col-md-6">
      <label class="form-label">{{ field.label }}</label>{{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
  </div>
  <div class="mt-4"><button class="btn btn-primary"><i class="bi bi-save"></i> Save</button><a class="btn btn-light" href="javascript:history.back()">Cancel</a></div>
</form>
{% endblock %}
