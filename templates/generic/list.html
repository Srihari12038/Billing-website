{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1>{% if add_url %}<a class="btn btn-primary" href="{% url add_url %}"><i class="bi bi-plus-lg"></i> Add</a>{% endif %}</div>
<div class="panel table-responsive"><table class="table align-middle"><thead><tr>{% for col in columns %}<th>{{ col|title }}</th>{% endfor %}<th></th></tr></thead><tbody>{% for object in object_list %}<tr>{% for col in columns %}<td>{{ object }}</td>{% endfor %}<td class="text-end"><a class="btn btn-sm btn-light" href="{{ object.get_absolute_url|default:'#' }}"><i class="bi bi-eye"></i></a></td></tr>{% empty %}<tr><td colspan="8" class="text-muted">No records found.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
