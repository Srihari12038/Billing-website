{% extends "base.html" %}{% block content %}<div class="page-head"><h1>Inventory</h1><a class="btn btn-primary" href="{% url 'stock_history_add' %}"><i class="bi bi-plus-lg"></i> Stock Movement</a></div><div class="panel table-responsive"><table class="table"><thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Notes</th></tr></thead><tbody>{% for row in object_list %}<tr><td>{{ row.movement_date }}</td><td>{{ row.product.name }}</td><td>{{ row.get_movement_type_display }}</td><td>{{ row.quantity }}</td><td>{{ row.notes }}</td></tr>{% empty %}<tr><td colspan="5" class="text-muted">No movements.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
